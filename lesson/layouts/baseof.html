<!doctype html>
<html lang="en" data-theme="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
{{ with resources.Get "css/book.css" }}
  {{ with . | minify | fingerprint }}
    <link rel="stylesheet" href="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}">
  {{ end }}
{{ end }}
<script>
  // Set before first paint so the page never flashes the wrong theme.
  try {
    var t = localStorage.getItem("theme");
    if (t) document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
</head>
<body>

<a class="skip" href="#main">Skip to content</a>

<input type="checkbox" id="nav-toggle" hidden>

<header class="topbar">
  <label for="nav-toggle" class="burger" aria-label="Toggle chapter list">
    <span></span><span></span><span></span>
  </label>
  <a class="topbar-title" href="{{ .Site.Home.RelPermalink }}">{{ .Site.Title }}</a>
  {{ partial "theme-toggle.html" . }}
</header>

{{ partial "sidebar.html" . }}

<main id="main">
  {{ block "main" . }}{{ end }}
  {{ partial "pager.html" . }}
</main>

<script>
  // The pager sits at the foot of the page, so without this the browser keeps
  // the scroll offset and the next chapter opens near its bottom.
  if ("scrollRestoration" in history) history.scrollRestoration = "manual";
  window.scrollTo({ top: 0, behavior: "instant" });
  addEventListener("pageshow", function (e) {
    if (e.persisted) window.scrollTo({ top: 0, behavior: "instant" });
  });

  (function () {
    var root = document.documentElement;
    var btn = document.getElementById("theme-btn");
    if (!btn) return;
    btn.addEventListener("click", function () {
      // system -> light -> dark -> system
      var cur = root.dataset.theme || "";
      var next = cur === "" ? "light" : cur === "light" ? "dark" : "";
      root.dataset.theme = next;
      try { next ? localStorage.setItem("theme", next) : localStorage.removeItem("theme"); } catch (e) {}
      btn.setAttribute("aria-label", "Theme: " + (next || "system"));
    });
  })();

  // Close the mobile drawer once a chapter is picked.
  document.querySelectorAll(".sidebar a").forEach(function (a) {
    a.addEventListener("click", function () {
      var t = document.getElementById("nav-toggle");
      if (t) t.checked = false;
    });
  });

  // ---- reading progress -------------------------------------------------
  // Stored per browser. Reads and writes are wrapped because a private window
  // or blocked site data makes localStorage throw rather than return null.
  (function () {
    var KEY = "vla-book-read";

    function slugOf(path) {
      return path.replace(/\/index\.html$/, "").replace(/\.html$/, "")
                 .replace(/\/$/, "").split("/").pop();
    }
    function load() {
      try { return new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); }
      catch (e) { return new Set(); }
    }
    function save(set) {
      try { localStorage.setItem(KEY, JSON.stringify([...set])); } catch (e) {}
    }

    var read = load();
    var here = slugOf(location.pathname);
    var items = [...document.querySelectorAll(".toc a")];

    function paint() {
      items.forEach(function (a) {
        var done = read.has(slugOf(a.getAttribute("href")));
        a.classList.toggle("read", done);
        a.querySelector(".tick").textContent = done ? "\u2713" : "";
      });
      var n = items.filter(function (a) {
        return read.has(slugOf(a.getAttribute("href")));
      }).length;
      var out = document.getElementById("progress");
      if (out) {
        out.textContent = n + " of " + items.length + " read";
        out.nextElementSibling.hidden = n === 0;
      }
    }

    // A tick per chapter, clickable so you can mark where you already are.
    items.forEach(function (a) {
      var tick = document.createElement("span");
      tick.className = "tick";
      tick.title = "Mark read";
      a.appendChild(tick);
      tick.addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();
        var s = slugOf(a.getAttribute("href"));
        read.has(s) ? read.delete(s) : read.add(s);
        save(read);
        paint();
      });
    });

    // Moving on marks the chapter you are leaving.
    var next = document.querySelector(".pager-next");
    if (next && here) {
      next.addEventListener("click", function () {
        read.add(here);
        save(read);
      });
    }

    var reset = document.getElementById("progress-reset");
    if (reset) {
      reset.addEventListener("click", function (e) {
        e.preventDefault();
        read = new Set();
        save(read);
        paint();
      });
    }

    paint();
  })();
</script>

</body>
</html>
